apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payment-svc-qa
  namespace: argocd
  labels:
    app.kubernetes.io/name: payment-svc
    idp.lab/environment: qa
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Chart: OCI artifact published by payment-svc CI.
    - repoURL: ghcr.io/bhumi46/charts
      chart: payment-svc
      targetRevision: 0.1.0
      helm:
        releaseName: payment-svc
        valueFiles:
          - $values/envs/qa/payment-svc/values.yaml
    # Values: this repo.
    - repoURL: https://github.com/bhumi46/gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: qa   # created by platform-infra (Terraform), not by Argo CD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
